<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تكرم - TEKRAM</title>
    <!-- استيراد أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
        }

        /* --- تصميم الشريط العلوي الجديد --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            position: relative; /* ضروري لتثبيت اللوغو في المنتصف بدقة */
            height: 60px;
        }

        /* أيقونة القائمة (على اليسار في الواجهة العربية) */
        .menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #333;
            cursor: pointer;
            z-index: 2;
        }

        /* اللوغو في المنتصف تماماً */
        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 1;
        }

        .logo-container h1 {
            font-size: 20px;
            font-weight: bold;
            color: #1b3b22;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .logo-container span {
            font-size: 11px;
            color: #555;
            display: block;
        }

        /* الأيقونات على اليمين (البحث والسلة) */
        .header-icons {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 2;
        }

        .header-icons a {
            background: none;
            border: none;
            font-size: 18px;
            color: #333;
            cursor: pointer;
            position: relative;
            text-decoration: none;
        }

        /* شارة عدد المنتجات في السلة */
        .cart-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background-color: #d9534f;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 50%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي (Top Bar) -->
    <header class="top-bar">
        <!-- زر القائمة الجانبية (يمين الشاشة في الواجهة العربية) -->
        <button class="menu-btn" aria-label="القائمة">
            <i class="fas fa-bars"></i>
        </button>

        <!-- اللوغو في المنتصف -->
        <div class="logo-container">
            <h1>TEKRAM</h1>
            <span>تكرم</span>
        </div>

        <!-- الأيقونات (البحث والسلة) -->
        <div class="header-icons">
            <a href="#" aria-label="بحث">
                <i class="fas fa-search"></i>
            </a>
            <a href="#" aria-label="السلة">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge">13</span>
            </a>
        </div>
    </header>

</body>
</html>

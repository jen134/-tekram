<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تِكرَم | Tekram</title>

<style>
:root{
--g:#1b3b2b;
--g2:#244f3e;
--c:#f4efe6;
--w:#fff;
--text:#2c2c2c;
--m:#777;
--o:#df5035;
--gold:#d9a441;
--b:#e1ddd5
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Segoe UI',Tahoma,Arial,sans-serif;
background:#fff;
color:var(--text);
line-height:1.6
}

button,input,textarea,select{font-family:inherit}
button{cursor:pointer}

header{
height:78px;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 30px;
background:#fff;
border-bottom:1px solid #e5e5e5;
position:sticky;
top:0;
z-index:20
}

.head{
width:100%;
display:flex;
align-items:center;
justify-content:space-between
}

.logo-wrap{
position:absolute;
left:50%;
transform:translateX(-50%);
text-align:center;
color:var(--g);
font-weight:bold;
line-height:1
}

.logo-wrap img{
width:110px;
height:55px;
object-fit:contain
}

.nav-icons{
display:flex;
gap:8px
}

.icon{
width:40px;
height:40px;
border:0;
background:none;
color:var(--g);
font-size:20px
}

.cart-top{position:relative}

.count{
position:absolute;
top:-3px;
right:-5px;
background:var(--o);
color:#fff;
border-radius:20px;
padding:1px 6px;
font-size:9px
}

.search-wrap{
background:#fff;
padding:12px 30px 0
}

.search{
max-width:900px;
margin:auto;
height:45px;
border:1px solid #ddd;
border-radius:25px;
display:flex;
align-items:center;
padding:0 16px;
gap:8px;
background:#fff
}

.search input{
width:100%;
border:0;
outline:0;
background:none;
font-size:13px
}

.hero-banner{
max-width:1250px;
margin:20px auto;
padding:30px;
background:var(--c);
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
min-height:230px
}

.hero-text h1{
font-size:clamp(22px,3.5vw,34px);
line-height:1.3;
color:var(--g);
margin-bottom:15px;
font-weight:800
}

.hero-image-container{
width:320px;
height:180px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><path d="M10 10h80v80H10z"/></svg>');
border-radius:10px
}

.hero-bag-mock{
width:150px;
height:140px;
background:#f7f3ed;
border:2px dashed var(--g);
border-radius:10px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:10px;
font-size:11px;
color:var(--g);
box-shadow:0 8px 20px rgba(0,0,0,0.08)
}

.btn{
background:var(--g);
color:#fff;
padding:9px 22px;
border:0;
border-radius:20px;
font-size:13px;
font-weight:600;
transition:0.2s
}
.btn:hover{background:var(--g2)}

.section{
max-width:1250px;
margin:auto;
padding:15px 30px 120px
}

.title{
margin:15px 0 15px
}

.title h2{
font-size:22px;
color:var(--g)
}

.title p{
font-size:12px;
color:var(--m)
}

.categories{
display:flex;
gap:12px;
overflow-x:auto;
padding:5px 0 18px;
scrollbar-width:none
}

.categories::-webkit-scrollbar{display:none}

.categories button{
min-width:110px;
border:1px solid var(--b);
background:#fff;
color:var(--g);
padding:10px 14px;
border-radius:10px;
font-size:12px;
font-weight:600;
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
transition:0.2s
}

.categories button:hover, .categories .active{
background:var(--g);
color:#fff;
border-color:var(--g)
}

.grid,.offer-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}

.card,.offer-card{
position:relative;
background:#fff;
border:1px solid #e2e2e2;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.2s
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 5px 18px #00000012
}

.pic{
margin:8px;
aspect-ratio:1;
background:#f5f5f5;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:45px
}

.pic img{
width:100%;
height:100%;
object-fit:contain
}

.info{
padding:7px 10px 12px
}

.badge{
display:inline-block;
background:#f1f1f1;
color:#666;
padding:2px 7px;
border-radius:10px;
font-size:8px
}

.offer-badge{
display:inline-block;
background:var(--o);
color:#fff;
padding:2px 7px;
border-radius:10px;
font-size:8px
}

.name{
font-size:13px;
font-weight:700;
margin-top:5px
}

.en{
font-size:9px;
color:var(--m)
}

.weight{
font-size:9px;
color:#666;
margin-top:2px
}

.bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:9px
}

.price{
font-size:16px;
font-weight:bold;
direction:ltr
}

.old-price{
font-size:10px;
color:#999;
text-decoration:line-through;
margin-left:4px;
direction:ltr
}

.new-price{
font-size:16px;
font-weight:bold;
color:var(--o);
direction:ltr
}

.discount{
font-size:8px;
font-weight:bold;
color:var(--o)
}

.add{
width:32px;
height:32px;
border:0;
border-radius:50%;
background:var(--g);
color:#fff;
font-size:18px
}

.fav{
position:absolute;
top:10px;
left:10px;
z-index:3;
width:30px;
height:30px;
border:0;
border-radius:50%;
background:#fff;
color:var(--g);
font-size:18px;
box-shadow:0 2px 7px #0002
}

.fav.on{color:var(--o)}

.empty{
grid-column:1/-1;
text-align:center;
padding:50px;
color:var(--m)
}

#offersSection{
display:none;
max-width:1250px;
margin:auto;
padding:10px 30px 20px
}

.offer-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}

.offer-title h2{
font-size:22px;
color:var(--g)
}

#productPage{
display:none;
padding:30px 30px 120px
}

.detail{
max-width:950px;
margin:auto;
background:#fff;
border:1px solid #e1e1e1;
border-radius:12px;
overflow:hidden;
display:grid;
grid-template-columns:1fr 1fr
}

.detail-img{
min-height:400px;
background:#f5f5f5;
display:flex;
align-items:center;
justify-content:center;
font-size:120px
}

.detail-img img{
width:100%;
height:100%;
min-height:400px;
object-fit:contain
}

.detail-info{
padding:40px;
display:flex;
flex-direction:column;
justify-content:center
}

.detail-cat{
color:var(--o);
font-size:11px;
font-weight:bold
}

.detail-name{
font-size:30px;
font-weight:bold;
color:var(--g)
}

.detail-en{
color:var(--m);
font-size:11px
}

.options{
display:flex;
gap:7px;
flex-wrap:wrap;
margin:18px 0
}

.option{
border:1px solid var(--g);
background:#fff;
color:var(--g);
padding:7px 12px;
border-radius:8px;
font-weight:bold
}

.option.sel{
background:var(--g);
color:#fff
}

.detail-price{
font-size:28px;
font-weight:bold;
direction:ltr
}

.detail-old-price{
font-size:13px;
color:#999;
text-decoration:line-through;
direction:ltr
}

.detail-desc{
font-size:12px;
color:#59625b;
margin:10px 0 18px
}

.detail-add,.back{
border:0;
padding:12px;
border-radius:9px;
font-weight:bold;
font-size:14px
}

.detail-add{
background:var(--g);
color:#fff
}

.back{
background:#eee;
color:var(--g);
margin-top:8px
}

.bottom-nav{
position:fixed;
z-index:50;
bottom:12px;
left:50%;
transform:translateX(-50%);
width:min(600px,94%);
background:#fff;
border:1px solid #ddd;
border-radius:25px;
padding:6px 12px;
display:flex;
justify-content:space-around;
box-shadow:0 5px 25px #0002
}

.bottom-nav button{
border:0;
background:none;
color:var(--m);
font-size:9px;
font-weight:bold
}

.bottom-nav span{
display:block;
font-size:19px
}

.bottom-nav .active{color:var(--o)}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0006;
z-index:100
}

.panel,.menu-panel{
position:fixed;
z-index:101;
top:0;
height:100vh;
background:#fff;
transition:.3s;
display:flex;
flex-direction:column
}

.panel{
right:-430px;
width:410px;
max-width:94%
}

.menu-panel{
left:-430px;
width:330px;
max-width:90%;
box-shadow:8px 0 30px #0002
}

.option-modal{
display:none;
position:fixed;
inset:0;
background:#0006;
z-index:200;
align-items:center;
justify-content:center;
padding:20px
}

.option-box{
width:min(420px,100%);
background:#fff;
border-radius:12px;
padding:25px 20px;
position:relative;
box-shadow:0 15px 50px #0004
}

.option-close{
position:absolute;
left:15px;
top:15px;
width:34px;
height:34px;
border:0;
border-radius:8px;
background:#eee;
color:var(--g);
font-size:21px
}

.option-box h3{
font-size:20px;
margin-bottom:3px;
padding-left:45px;
color:var(--g)
}

.option-box p{
font-size:11px;
color:var(--m);
margin-bottom:16px
}

.option-choices{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.pick-option{
border:1px solid var(--b);
background:var(--c);
color:var(--g);
padding:12px 8px;
border-radius:9px;
font-weight:bold
}

.pick-option small{
display:block;
color:var(--o);
font-size:10px
}

.menu-head{
padding:22px 18px;
background:var(--g);
color:#fff;
display:flex;
align-items:center;
justify-content:space-between
}

.menu-brand{
font:900 25px Georgia
}

.menu-brand small{
display:block;
font:11px Tahoma;
color:var(--gold);
font-weight:normal
}

.menu-close{
border:0;
background:none;
color:#fff;
font-size:30px
}

.menu-body{padding:14px}

.menu-btn{
width:100%;
border:0;
background:none;
display:flex;
align-items:center;
gap:13px;
padding:14px 13px;
border-radius:10px;
color:var(--g);
font-size:13px;
font-weight:bold;
text-align:right
}

.menu-btn:hover{background:var(--c)}

.menu-icon{
width:34px;
height:34px;
border-radius:8px;
background:var(--c);
display:flex;
align-items:center;
justify-content:center
}

.menu-divider{
height:1px;
background:var(--b);
margin:10px 5px
}

.menu-note{
padding:15px;
margin-top:10px;
background:var(--c);
border-radius:10px;
font-size:11px;
color:var(--m);
text-align:center
}

.panel-head{
padding:18px;
border-bottom:1px solid var(--b);
display:flex;
justify-content:space-between
}

.close{
border:0;
background:#eee;
border-radius:8px;
width:36px;
height:36px;
font-size:20px
}

.panel-body{
flex:1;
overflow:auto;
padding:18px
}

.cart-item{
padding:15px 0;
border-bottom:1px solid var(--b)
}

.cart-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px
}

.cart-name{
font-size:13px;
font-weight:bold
}

.cart-option{
display:block;
color:var(--m);
font-size:10px
}

.cart-price{
color:var(--o);
direction:ltr;
font-size:14px
}

.controls{
display:flex;
align-items:center;
gap:10px;
margin-top:10px
}

.qty{
width:30px;
height:30px;
border:0;
border-radius:8px;
background:var(--g);
color:#fff;
font-size:17px
}

.qty-number{
min-width:20px;
text-align:center
}

.remove{
border:0;
background:none;
color:var(--o);
margin-right:auto;
font-size:10px
}

.cart-empty{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:300px;
text-align:center;
color:var(--m)
}

.cart-empty span{font-size:50px}

.panel-foot{
padding:17px;
border-top:1px solid var(--b);
background:#fff
}

.total{
display:flex;
justify-content:space-between;
font-size:18px;
font-weight:bold;
margin-bottom:12px
}

.checkout{
width:100%;
border:0;
background:var(--g);
color:#fff;
padding:13px;
border-radius:9px;
font-weight:bold
}

.form{margin-bottom:12px}

.form label{
font-size:11px;
font-weight:bold
}

.input{
width:100%;
border:1px solid var(--b);
border-radius:8px;
padding:10px;
margin-top:4px;
outline:0;
background:#fff
}

.area{
height:65px;
resize:none
}

.summary{
background:var(--c);
padding:12px;
border-radius:9px;
margin-top:12px
}

.summary-row{
display:flex;
justify-content:space-between;
font-size:11px;
margin-bottom:8px
}

.final{
border-top:1px solid var(--b);
padding-top:10px;
font-weight:bold;
font-size:16px
}

footer{
background:var(--g);
color:#fff;
text-align:center;
padding:35px 20px 105px
}

.footer-logo{
font:28px Georgia;
color:#fff
}

@media(max-width:900px){
.grid,.offer-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:650px){
header{
height:70px;
padding:10px 15px
}
.logo-wrap img{
width:95px;
height:48px
}
.nav-icons{
gap:2px
}
.icon{
width:36px;
height:36px;
font-size:18px
}
.search-wrap{
padding:10px 15px 0
}
.hero-banner{
margin:15px;
padding:25px 20px;
min-height:210px
}
.hero-text h1{
font-size:22px
}
.hero-image-container{
width:120px
}
.section{
padding:10px 15px 110px
}
.grid,.offer-grid{
grid-template-columns:repeat(2,1fr);
gap:9px
}
.name{
font-size:11px
}
.price,.new-price{
font-size:15px
}
.add{
width:30px;
height:30px
}
.detail{
grid-template-columns:1fr
}
.detail-img,.detail-img img{
min-height:280px
}
.detail-info{
padding:25px
}
.detail-name{
font-size:26px
}
.menu-panel{
width:310px
}
}
</style>
</head>

<body>

<header>
<div class="head">

<div class="nav-icons">
<button class="icon" onclick="openMenu()">☰</button>
</div>

<a href="#" onclick="home();return false" class="logo-wrap">
<img src="./tekram-logo.JPG" alt="تِكرَم">
</a>

<div class="nav-icons">
<button class="icon" onclick="focusSearch()">⌕</button>
<button class="icon cart-top" onclick="openCart()">🛒<b id="count" class="count">0</b></button>
</div>

</div>
</header>

<div class="search-wrap">
<div class="search">
<span>⌕</span>
<input id="search" placeholder="إبحث عن منتج..." oninput="render()">
</div>
</div>

<main id="homePage">

<section class="hero-banner">
<div class="hero-text">
<h1>كل ما تحتاجه لبيتك<br>في مكان واحد</h1>
<button class="btn" onclick="scrollProducts()">تسوق الآن</button>
</div>

<div class="hero-image-container">
<div class="hero-bag-mock">
<span>🛍️ <b>TEKRAM</b></span>
<small style="margin-top:5px; color:#555;">من بيتنا لبيتك</small>
</div>
</div>
</section>

<section id="offersSection">
<div class="offer-title">
<h2>🔥 عروض تِكرَم</h2>
<span>وفّر أكتر مع تِكرَم</span>
</div>
<div id="offerGrid" class="offer-grid"></div>
</section>

<section class="section" id="products">

<div class="title">
<h2 id="title">منتجاتنا</h2>
<p id="sub">اختيارات من تِكرَم</p>
</div>

<div id="cats" class="categories"></div>
<div id="grid" class="grid"></div>

</section>

</main>

<section id="productPage">

<div class="detail">

<div id="dimg" class="detail-img"></div>

<div class="detail-info">

<div id="dcat" class="detail-cat"></div>
<div id="dname" class="detail-name"></div>
<div id="den" class="detail-en"></div>
<div id="options" class="options"></div>
<div id="dweight"></div>
<div id="doldprice" class="detail-old-price"></div>
<div id="dprice" class="detail-price"></div>
<div id="ddesc" class="detail-desc"></div>

<button class="detail-add" onclick="addSelected()">🛒 أضف للسلة</button>
<button class="back" onclick="home()">← العودة</button>

</div>
</div>
</section>

<div id="overlay" class="overlay" onclick="closePanels()"></div>

<div id="optionModal" class="option-modal" onclick="if(event.target===this)closeOptionPicker()">

<div class="option-box">

<button class="option-close" onclick="closeOptionPicker()">×</button>

<h3 id="optionTitle">اختاري النوع</h3>
<p>حدد طلبك</p>

<div id="optionChoices" class="option-choices"></div>

</div>
</div>

<div id="menuPanel" class="menu-panel">

<div class="menu-head">
<div class="menu-brand">
TEKRAM
<small>من بيتنا لبيتك</small>
</div>
<button class="menu-close" onclick="closePanels()">×</button>
</div>

<div class="menu-body">

<button class="menu-btn" onclick="menuHome()">
<span class="menu-icon">🏠</span>الرئيسية
</button>

<button class="menu-btn" onclick="menuProducts()">
<span class="menu-icon">🛍️</span>المنتجات
</button>

<button class="menu-btn" onclick="menuOffers()">
<span class="menu-icon">🔥</span>العروض
</button>

<button class="menu-btn" onclick="menuFavorites()">
<span class="menu-icon">❤️</span>المفضلة
</button>

<button class="menu-btn" onclick="menuCart()">
<span class="menu-icon">🛒</span>سلة المشتريات
</button>

<div class="menu-divider"></div>

<div class="menu-note">
تِكرَم 🤍<br>
من بيتنا لبيتك
</div>

</div>
</div>

<div id="cartPanel" class="panel">

<div class="panel-head">
<h2>🛒 السلة</h2>
<button class="close" onclick="closePanels()">×</button>
</div>

<div id="cartBody" class="panel-body"></div>

<div class="panel-foot">

<div class="total">
<span>المجموع</span>
<span id="total">$0.00</span>
</div>

<button class="checkout" onclick="checkout()">إتمام الطلب</button>

</div>
</div>

<div id="checkoutPanel" class="panel">

<div class="panel-head">
<h2>📦 إتمام الطلب</h2>
<button class="close" onclick="closePanels()">×</button>
</div>

<div class="panel-body">

<div class="form">
<label>الاسم</label>
<input id="name" class="input" placeholder="اكتب اسمك">
</div>

<div class="form">
<label>رقم الهاتف</label>
<input id="phone" class="input" placeholder="03 123 456">
</div>

<div class="form">
<label>المنطقة</label>

<select id="area" class="input">
<option value="">اختر منطقة التوصيل</option>
<option>صور</option>
<option>المعشوق</option>
<option>برج الشمالي</option>
<option>المساكن</option>
<option>الحوش</option>
<option>العباسية</option>
<option>البازورية</option>
</select>

</div>

<div class="form">
<label>العنوان</label>
<textarea id="address" class="input area" placeholder="اكتب العنوان"></textarea>
</div>

<div class="form">
<label>ملاحظات</label>
<textarea id="notes" class="input area" placeholder="اختياري"></textarea>
</div>

<div id="summary" class="summary"></div>

</div>

<div class="panel-foot">
<button id="send" class="checkout" onclick="sendOrder()">تأكيد الطلب ✓</button>
</div>

</div>

<div class="bottom-nav">

<button onclick="home()" class="active">
<span>⌂</span>الرئيسية
</button>

<button onclick="categoriesPage()">
<span>▦</span>الأقسام
</button>

<button onclick="favoritesPage()">
<span>♡</span>المفضلة
</button>

<button onclick="openCart()">
<span>🛒</span>السلة
</button>

</div>

<footer>
<div class="footer-logo">تِكرَم</div>
<p>من بيتنا لبيتك 🤍</p>
</footer>

<script>

const KEY="9edc6eae-83a6-4858-a452-12860503dcfa",
DELIVERY=2;

const cats=[
{name:"الكل",icon:"🛒"},
{name:"بقالة",icon:"🛍️"},
{name:"ألبان",icon:"🥛"},
{name:"مشروبات",icon:"🥤"},
{name:"سناكس",icon:"🍿"},
{name:"منظفات",icon:"🧴"}
];

const products=[
{id:"coffee-no",cat:"مشروبات",name:"قهوة نجار دون هال",en:"Najjar Coffee No Cardamom",price:3.35,weight:"180 غ / 450 غ",img:"./najjar-coffee-no-cardamom-180g.JPG",options:[
["180 غ",3.35,"./najjar-coffee-no-cardamom-180g.JPG"],
["450 غ",6.85,"./najjar-coffee-no-cardamom-450g.JPG"]]},

{id:"coffee-card",cat:"مشروبات",name:"قهوة نجار مع هال",en:"Najjar Coffee with Cardamom",price:3.55,weight:"180 غ / 450 غ",img:"./najjar-coffee-with-cardamom-180g.JPG",options:[
["180 غ",3.55,"./najjar-coffee-with-cardamom-180g.JPG"],
["450 غ",7.35,"./najjar-coffee-with-cardamom-450g.JPG"]]},

{id:"coffeemate",cat:"مشروبات",name:"كريمر كوفي ميت",en:"Coffee Mate",price:2.5,weight:"450 غ / 1 كغ",img:"./coffee-mate-450g.JPG",options:[
["450 غ",2.5,"./coffee-mate-450g.JPG"],
["1 كغ",6,"./Coffee-mate-1kg.JPG"]]},

{id:"ghazal",cat:"ألبان",name:"جبنة الغزال",en:"Al Ghazal Cheese",price:3,weight:"370 غ / 1.5 كغ",img:"./Ghazal-cheese-370g.png",options:[
["370 غ",3,"./Ghazal-cheese-370g.png"],
["1.5 كغ",11.5,""]]},

{id:"almarai",cat:"ألبان",name:"جبنة المراعي",en:"Almarai Cheese",price:1.7,weight:"300 غ",icon:"🧀"},

{id:"greek",cat:"ألبان",name:"يوغرت تعنايل غريك",en:"Taanayel Greek Yogurt",price:1.25,weight:"سادة / فريز / توت / دراق",img:"./Taanyel-greek-yogurt-strawberry.JPG",options:[
["سادة",1.25,"🥛"],
["فريز",1.25,"./Taanyel-greek-yogurt-strawberry.JPG"],
["توت",1.25,"./Taanyel-greek-yogurt-bluberry.JPG"],
["دراق",1.25,"🍑"]]},

{id:"corn",cat:"بقالة",name:"ذرة حلوة لا بيلا",en:"La Bella Sweet Corn",price:.85,weight:"340 غ",img:"./la-bella-sweet-corn-340g.JPG"},

{id:"red",cat:"مشروبات",name:"نجار نسكافيه الأحمر",en:"Najjar Red",price:3,weight:"95 غ / 190 غ",img:"./najjar-red-95g.JPG",options:[
["95 غ",3,"./najjar-red-95g.JPG"],
["190 غ",4.9,"./najjar-red-190g.JPG"]]},

{id:"picon",cat:"ألبان",name:"بيكون جبنة",en:"Picon Cheese",price:2.5,weight:"×16 / ×24",img:"./Picon-cheese-*16.JPG",options:[
["×16",2.5,"./Picon-cheese-*16.JPG"],
["×24",3,"./Picon-cheese-*24.JPG"]]},

{id:"oxi",cat:"منظفات",name:"أوكسي سائل جلي",en:"Oxi Dishwashing Liquid",price:1.3,weight:"تفاح / ليمون",img:"./Oxi-dishwashing-liquid-apple-600ml.JPG",options:[
["تفاح",1.3,"./Oxi-dishwashing-liquid-apple-600ml.JPG"],
["ليمون",1.3,"./Oxi-dishwashing-liquid-lemon-600ml.JPG"]]}
];

let cart=JSON.parse(localStorage.getItem("tekramCart")||"[]"),
fav=JSON.parse(localStorage.getItem("tekramFavorites")||"[]"),
category="الكل",
onlyFav=false,
selected=null,
tekramBackPosition=null;

const $=id=>document.getElementById(id);

function save(){
localStorage.setItem("tekramCart",JSON.stringify(cart));
localStorage.setItem("tekramFavorites",JSON.stringify(fav))
}

function focusSearch(){
$("search").focus();
$("search").scrollIntoView({behavior:"smooth",block:"center"})
}

function nav(n){
document.querySelectorAll(".bottom-nav button")
.forEach((x,i)=>x.classList.toggle("active",i===n))
}

function categoriesHTML(){
$("cats").innerHTML=cats.map(x=>
`<button class="${x.name===category&&!onlyFav?"active":""}" onclick="choose('${x.name}')"><span>${x.icon}</span>${x.name}</button>`
).join("")
}

function discountPercent(a,b){
return Math.round((1-b/a)*100)
}

function priceHTML(p){
return p.oldPrice
?`<span class="old-price">$${p.oldPrice.toFixed(2)}</span><span class="new-price">$${p.price.toFixed(2)}</span><span class="discount">-${discountPercent(p.oldPrice,p.price)}%</span>`
:`<span class="price">${p.options?"من ":""}$${p.price.toFixed(2)}</span>`
}

function card(p){
let f=fav.includes(p.id);
return `<div class="card" onclick="detail('${p.id}')">
<button class="fav ${f?"on":""}" onclick="toggleFav(event,'${p.id}')">${f?"♥":"♡"}</button>
<div class="pic">${p.img?`<img src="${p.img}" alt="${p.name}">`:p.icon||"🛒"}</div>
<div class="info">
<span class="badge">${p.cat}</span>
${p.oldPrice?`<span class="offer-badge">🔥 عرض</span>`:""}
<div class="name">${p.name}</div>
<div class="en">${p.en}</div>
<div class="weight">${p.weight}</div>
<div class="bottom">
<div>${priceHTML(p)}</div>
<button class="add" onclick="quick(event,'${p.id}')">+</button>
</div>
</div>
</div>`
}

function offerCard(p){
return `<div class="offer-card" onclick="detail('${p.id}')">
<div class="pic">${p.img?`<img src="${p.img}" alt="${p.name}">`:p.icon||"🛒"}</div>
<div class="info">
<div class="name">${p.name}</div>
<div class="en">${p.en}</div>
<div class="weight">${p.weight}</div>
<div class="bottom">
<div>${priceHTML(p)}</div>
<button class="add" onclick="quick(event,'${p.id}')">+</button>
</div>
</div>
</div>`
}

function renderOffers(){
let o=products.filter(p=>p.oldPrice);
$("offersSection").style.display=o.length?"block":"none";
if(o.length) $("offerGrid").innerHTML=o.map(offerCard).join("")
}

function render(){
let q=$("search").value.trim().toLowerCase();
let list=products.filter(p=>
(!onlyFav||fav.includes(p.id))&&
(category==="الكل"||p.cat===category)&&
(!q||(p.name+" "+p.en).toLowerCase().includes(q))
);

$("title").textContent=onlyFav?"المفضلة":q?"نتائج البحث":category==="الكل"?"منتجاتنا":category;
$("sub").textContent=onlyFav?"المنتجات التي حفظتها ❤️":"اختيارات من تِكرَم";
$("grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty">ما لقينا منتجات مطابقة ❤️</div>`;

categoriesHTML();
renderOffers();
updateCart()
}

function choose(x){
category=x;
onlyFav=false;
render();
scrollProducts();
nav(1)
}

function categoriesPage(){
closePanels();
home();
nav(1);
setTimeout(scrollProducts,50)
}

function favoritesPage(){
category="الكل";
onlyFav=true;
$("productPage").style.display="none";
$("homePage").style.display="block";
render();
nav(2);
scrollProducts()
}

function toggleFav(e,id){
e.stopPropagation();
fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];
save();
render()
}

function quick(e,id){
e.stopPropagation();
let p=products.find(x=>x.id===id);
if(!p.options){
add({name:p.name,option:p.weight,price:p.price});
openCart();
return
}
openOptionPicker(p)
}

function openOptionPicker(p){
$("optionTitle").textContent=p.name;
$("optionChoices").innerHTML=p.options.map((o,i)=>
`<button class="pick-option" onclick="pickOption('${p.id}',${i})">${o[0]}<small>$${o[1].toFixed(2)}</small></button>`
).join("");
$("optionModal").style.display="flex"
}

function pickOption(id,i){
let p=products.find(x=>x.id===id), o=p.options[i];
add({name:p.name,option:o[0],price:o[1]});
closeOptionPicker();
openCart()
}

function closeOptionPicker(){
$("optionModal").style.display="none"
}

function detail(id,opt=0){
let p=products.find(x=>x.id===id),
o=p.options?p.options[opt]:[p.weight,p.price,p.img||p.icon||""];
if(tekramBackPosition===null) tekramBackPosition=window.scrollY;
selected={name:p.name,option:o[0],price:o[1],oldPrice:p.oldPrice||null};

$("dcat").textContent=p.cat;
$("dname").textContent=p.name;
$("den").textContent=p.en;
$("dweight").textContent=o[0];
$("dprice").textContent="$"+o[1].toFixed(2);
$("doldprice").textContent=p.oldPrice?"$"+p.oldPrice.toFixed(2):"";
$("ddesc").textContent=p.name+", "+o[0];
$("dimg").innerHTML=typeof o[2]==="string"&&o[2].startsWith(".")?`<img src="${o[2]}" alt="${p.name}">`:`<span>${o[2]||p.icon||"🛒"}</span>`;
$("options").innerHTML=p.options?p.options.map((x,i)=>`<button class="option ${i===opt?"sel":""}" onclick="detail('${p.id}',${i})">${x[0]}</button>`).join(""):"";

$("homePage").style.display="none";
$("productPage").style.display="block";
window.scrollTo(0,0)
}

function add(x){
let o=cart.find(i=>i.name===x.name&&i.option===x.option);
o?o.qty++:cart.push({...x,qty:1});
save();
updateCart()
}

function addSelected(){
add(selected);
openCart()
}

function updateCart(){
$("count").textContent=cart.reduce((a,x)=>a+x.qty,0);
if(!cart.length){
$("cartBody").innerHTML=`<div class="cart-empty"><span>🛒</span>السلة فارغة<small>أضف منتجاتك المفضلة من تِكرَم 🤍</small></div>`;
$("total").textContent="$0.00";
return
}
$("cartBody").innerHTML=cart.map((x,i)=>
`<div class="cart-item">
<div class="cart-row">
<div><div class="cart-name">${x.name}</div><span class="cart-option">${x.option}</span></div>
<b class="cart-price">$${(x.price*x.qty).toFixed(2)}</b>
</div>
<div class="controls">
<button class="qty" onclick="qty(${i},-1)">−</button>
<b class="qty-number">${x.qty}</b>
<button class="qty" onclick="qty(${i},1)">+</button>
<button class="remove" onclick="removeItem(${i})">حذف</button>
</div>
</div>`
).join("");
$("total").textContent="$"+cart.reduce((a,x)=>a+x.price*x.qty,0).toFixed(2)
}

function qty(i,n){
cart[i].qty+=n;
if(cart[i].qty<1) cart.splice(i,1);
save();
updateCart()
}

function removeItem(i){
cart.splice(i,1);
save();
updateCart()
}

function openCart(){
closePanels();
$("cartPanel").style.right="0";
$("overlay").style.display="block";
nav(3)
}

function checkout(){
if(!cart.length) return alert("السلة فارغة");
closePanels();
$("checkoutPanel").style.right="0";
$("overlay").style.display="block";
let s=cart.reduce((a,x)=>a+x.price*x.qty,0);
$("summary").innerHTML=cart.map(x=>`<div class="summary-row"><span>${x.name}<br><small>${x.option} × ${x.qty}</small></span><b>$${(x.price*x.qty).toFixed(2)}</b></div>`).join("")+
`<div class="summary-row"><b>المجموع الفرعي</b><b>$${s.toFixed(2)}</b></div>
<div class="summary-row"><b>التوصيل</b><b>$${DELIVERY.toFixed(2)}</b></div>
<div class="summary-row final"><b>المجموع النهائي</b><b>$${(s+DELIVERY).toFixed(2)}</b></div>`
}

function closePanels(){
$("cartPanel").style.right="-430px";
$("checkoutPanel").style.right="-430px";
$("menuPanel").style.left="-430px";
$("overlay").style.display="none"
}

function openMenu(){
closePanels();
$("menuPanel").style.left="0";
$("overlay").style.display="block"
}

function menuHome(){ closePanels(); home(); }
function menuProducts(){ closePanels(); home(); setTimeout(scrollProducts,100); }
function menuOffers(){ closePanels(); home(); setTimeout(()=>{ let s=$("offersSection"); s.style.display!=="none"?s.scrollIntoView({behavior:"smooth"}):alert("ما في عروض مضافة حاليًا 🔥"); },100); }
function menuFavorites(){ closePanels(); favoritesPage(); }
function menuCart(){ closePanels(); openCart(); }

async function sendOrder(){
let n=$("name").value.trim(), ph=$("phone").value.trim(), ar=$("area").value, ad=$("address").value.trim();
if(!n||!ph||!ar||!ad) return alert("يرجى تعبئة الاسم والهاتف والمنطقة والعنوان");
let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),
order=cart.map(x=>`• ${x.name} | ${x.option} | ×${x.qty} | $${(x.price*x.qty).toFixed(2)}`).join("\n");
$("send").disabled=true;
$("send").textContent="جاري الإرسال...";
try{
let r=await fetch("https://api.web3forms.com/submit",{
method:"POST",
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify({access_key:KEY,subject:"🛒 طلب جديد من تِكرَم",name:n,phone:ph,area:ar,address:ad,notes:$("notes").value,order,subtotal:"$"+sub.toFixed(2),delivery:"$"+DELIVERY.toFixed(2),total:"$"+(sub+DELIVERY).toFixed(2)})
});
let data=await r.json();
if(data.success){
alert("تم إرسال طلبك بنجاح ❤️");
cart=[]; save(); updateCart(); closePanels();
$("name").value=""; $("phone").value=""; $("area").value=""; $("address").value=""; $("notes").value="";
}else{alert("تعذر إرسال الطلب.");}
}catch(e){alert("تعذر إرسال الطلب حالياً.");}
$("send").disabled=false;
$("send").textContent="تأكيد الطلب ✓"
}

function home(){
$("productPage").style.display="none";
$("homePage").style.display="block";
category="الكل";
onlyFav=false;
render();
nav(0);
if(tekramBackPosition!==null){
let y=tekramBackPosition; tekramBackPosition=null;
setTimeout(()=>{ window.scrollTo({top:y,behavior:"smooth"}); },50)
}else{window.scrollTo({top:0,behavior:"smooth"})}
}

function scrollProducts(){$("products").scrollIntoView({behavior:"smooth"})}

categoriesHTML();
render();
</script>

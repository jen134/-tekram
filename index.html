<title>تِكرَم | Tekram</title>

:root{
--g:#183d30;
--g2:#244f3e;
--c:#f7f0e4;
--o:#df5035;
--y:#e5aa45;
--w:#fffdf8;
--text:#26332d;
--muted:#7b827d;
--line:#e8e0d4;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:var(--c);
color:var(--text);
}

button{
font-family:inherit;
cursor:pointer;
}

header{
height:68px;
background:var(--g);
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:sticky;
top:0;
z-index:50;
box-shadow:0 2px 12px #0002;
}

.logo{
font-size:24px;
font-weight:900;
letter-spacing:.5px;
}

.logo span{
display:block;
font-size:11px;
font-weight:normal;
opacity:.75;
text-align:center;
margin-top:-2px;
}

.head-actions{
display:flex;
align-items:center;
gap:8px;
}

.icon-btn{
width:40px;
height:40px;
border:0;
border-radius:12px;
background:#ffffff18;
color:white;
font-size:20px;
display:flex;
align-items:center;
justify-content:center;
}

.cart-count{
position:absolute;
background:var(--o);
color:white;
font-size:10px;
min-width:17px;
height:17px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
top:-3px;
right:-3px;
font-weight:bold;
}

.cart-wrap{
position:relative;
}

.search{
padding:12px 14px;
background:white;
border-bottom:1px solid var(--line);
}

.search input{
width:100%;
height:43px;
border:1px solid var(--line);
border-radius:13px;
padding:0 15px;
font-size:14px;
outline:none;
background:#fffdf9;
}

.hero{
margin:14px;
background:var(--g);
border-radius:22px;
padding:24px 20px;
color:white;
overflow:hidden;
position:relative;
}

.hero:after{
content:"";
position:absolute;
width:160px;
height:160px;
border-radius:50%;
background:#ffffff0b;
left:-45px;
top:-50px;
}

.hero h1{
margin:0 0 8px;
font-size:25px;
line-height:1.4;
position:relative;
z-index:1;
}

.hero p{
margin:0 0 17px;
font-size:13px;
opacity:.85;
position:relative;
z-index:1;
}

.hero-btn{
border:0;
background:var(--y);
color:#fff;
border-radius:12px;
padding:11px 16px;
font-weight:bold;
position:relative;
z-index:1;
}

.section{
padding:0 14px;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin:18px 0 11px;
}

.section-title h2{
font-size:18px;
margin:0;
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:4px;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{
display:none;
}

.cat{
white-space:nowrap;
border:1px solid var(--line);
background:white;
color:var(--g);
border-radius:20px;
padding:9px 14px;
font-size:12px;
font-weight:bold;
}

.cat.active{
background:var(--g);
color:white;
border-color:var(--g);
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:11px;
padding-bottom:95px;
}

.card{
background:white;
border-radius:17px;
overflow:hidden;
border:1px solid #eee5d8;
box-shadow:0 3px 10px #00000008;
position:relative;
}

.card-img{
width:100%;
aspect-ratio:1/1;
background:#f7f5ef;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.card-img img{
width:100%;
height:100%;
object-fit:contain;
}

.fav{
position:absolute;
top:8px;
left:8px;
width:32px;
height:32px;
border:0;
border-radius:50%;
background:#fffdf8e8;
font-size:18px;
z-index:2;
}

.card-body{
padding:10px;
}

.card-name{
font-size:14px;
font-weight:bold;
line-height:1.35;
min-height:38px;
}

.card-en{
font-size:10px;
color:var(--muted);
margin-top:3px;
direction:ltr;
text-align:right;
}

.card-weight{
font-size:11px;
color:var(--muted);
margin-top:6px;
}

.card-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:5px;
margin-top:9px;
}

.price{
font-size:16px;
font-weight:900;
color:var(--g);
}

.add-small{
border:0;
background:var(--o);
color:white;
border-radius:10px;
width:35px;
height:35px;
font-size:18px;
font-weight:bold;
}

.product-page{
display:none;
padding:14px;
padding-bottom:100px;
}

.detail-card{
background:white;
border-radius:20px;
overflow:hidden;
border:1px solid var(--line);
}

.detail-img{
width:100%;
height:330px;
background:#f8f6f0;
display:flex;
align-items:center;
justify-content:center;
}

.detail-img img{
width:100%;
height:100%;
object-fit:contain;
}

.detail-body{
padding:18px;
}

.detail-title{
font-size:23px;
font-weight:900;
margin-bottom:4px;
}

.detail-en{
font-size:12px;
color:var(--muted);
direction:ltr;
text-align:right;
}

.detail-price{
font-size:22px;
font-weight:900;
color:var(--g);
margin-top:13px;
}

.options{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:14px 0;
}

.option{
border:1px solid var(--line);
background:white;
border-radius:11px;
padding:9px 13px;
font-size:12px;
}

.option.active{
background:var(--g);
color:white;
border-color:var(--g);
}

.detail-add,
.back{
border:0;
padding:13px;
border-radius:13px;
font-weight:bold;
font-size:15px;
width:100%;
}

.detail-add{
background:var(--o);
color:white;
}

.back{
background:var(--g);
color:white;
margin-top:8px;
}

.menu{
position:fixed;
inset:0;
background:#0006;
z-index:100;
display:none;
}

.menu-box{
position:absolute;
right:0;
top:0;
height:100%;
width:82%;
max-width:350px;
background:var(--w);
padding:20px;
box-shadow:-5px 0 25px #0002;
}

.menu-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.menu-head h2{
margin:0;
color:var(--g);
}

.close-menu{
border:0;
background:none;
font-size:27px;
color:var(--g);
}

.menu-item{
width:100%;
border:0;
background:white;
padding:15px;
border-bottom:1px solid var(--line);
text-align:right;
font-size:15px;
}

.cart-panel{
position:fixed;
inset:0;
background:#0006;
z-index:120;
display:none;
}

.cart-box{
position:absolute;
bottom:0;
right:0;
left:0;
background:var(--w);
border-radius:25px 25px 0 0;
max-height:88vh;
padding:18px;
overflow-y:auto;
}

.cart-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.cart-head h2{
margin:0;
color:var(--g);
}

.cart-close{
border:0;
background:none;
font-size:26px;
}

.cart-item{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid var(--line);

.cart-item-img{
width:58px;
height:58px;
border-radius:10px;
background:#f6f3ec;
object-fit:contain;
}

.cart-item-info{
flex:1;

.cart-item-name{
font-size:13px;
font-weight:bold;

.cart-item-option{
font-size:11px;
color:var(--muted);
margin-top:3px;

.qty{
display:flex;
align-items:center;
gap:8px;

.qty button{
border:0;
background:var(--g);
color:white;
width:27px;
height:27px;
border-radius:8px;
font-weight:bold;
}

.cart-summary{
margin-top:16px;
background:#f7f1e7;
border-radius:15px;
padding:14px;
}

.sum-row{
display:flex;
justify-content:space-between;
margin:7px 0;
font-size:14px;

font-size:18px;
font-weight:900;
color:var(--g);
border-top:1px solid var(--line);
padding-top:10px;
margin-top:10px;
}

width:100%;
border:0;
background:var(--o);
color:white;
padding:14px;
border-radius:13px;
font-size:15px;
font-weight:bold;
margin-top:12px;

position:fixed;

right:0;
left:0;
height:70px;
background:#fffdfbf5;

border-top:1px solid var(--line);
display:flex;
justify-content:space-around;
align-items:center;
z-index:60;
}

.nav-btn{
border:0;
background:none;
color:#7d837e;
font-size:10px;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
}

.nav-btn span{
font-size:21px;
}

.nav-btn.active{
color:var(--g);
font-weight:bold;
}

.toast{
position:fixed;
bottom:85px;
left:50%;
transform:translateX(-50%);
background:var(--g);
color:white;
padding:11px 18px;
border-radius:12px;
font-size:13px;
display:none;
z-index:200;
white-space:nowrap;

@media(min-width:700px){
.grid{
grid-template-columns:repeat(4,minmax(0,1fr));
}

.hero{
margin:20px auto;

}

.section{
max-width:1000px;
margin:auto;
}

.search{
padding:12px calc((100% - 1000px)/2);

.product-page{
max-width:700px;
margin:auto;

let selected=null;
let selectedOption=0;

let cart=JSON.parse(localStorage.getItem("tekramCart")||"[]");
let favorites=JSON.parse(localStorage.getItem("tekramFavorites")||"[]");

function save(){
localStorage.setItem("tekramCart",JSON.stringify(cart));
localStorage.setItem("tekramFavorites",JSON.stringify(favorites));
updateCartCount();
}

function money(n){
return "$"+Number(n).toFixed(2);
}

function toast(msg){
$("toast").textContent=msg;
$("toast").style.display="block";

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{
$("toast").style.display="none";
},1600);
}

function renderCategories(){

$("categories").innerHTML=categories.map(c=>`
<button class="cat ${category===c&&!onlyFav?"active":""}"
onclick="setCategory('${c}')">
${c}
</button>
`).join("");

}

function setCategory(c){

category=c;
onlyFav=false;

$("homePage").style.display="block";
$("productPage").style.display="none";

render();
window.scrollTo({top:0,behavior:"smooth"});

}

function render(){

renderCategories();

const q=$("searchInput").value.trim().toLowerCase();

let list=productsData.filter(p=>{

let catOk=category==="الكل"||p.cat===category;

let favOk=!onlyFav||favorites.includes(p.id);

let searchOk=
!q||
p.name.toLowerCase().includes(q)||
p.en.toLowerCase().includes(q);

return catOk&&favOk&&searchOk;

});

$("products").innerHTML=list.length
?list.map(card).join("")
:`<div class="empty" style="grid-column:1/-1">
لا توجد منتجات
</div>`;

updateCartCount();

}

function card(p){

const fav=favorites.includes(p.id);

return `
<div class="card" onclick="detail('${p.id}')">

<button class="fav"
onclick="event.stopPropagation();toggleFav('${p.id}')">
${fav?"❤️":"♡"}
</button>

<div class="card-img">
<img src="${p.img}" alt="${p.name}"
onerror="this.style.display='none'">
</div>

<div class="card-body">

<div class="card-name">${p.name}</div>

<div class="card-en">${p.en}</div>

<div class="card-weight">${p.weight||""}</div>

<div class="card-bottom">

<div class="price">${money(p.price)}</div>

<button class="add-small"
onclick="event.stopPropagation();quick(event,'${p.id}')">
+
</button>

</div>

</div>
</div>
`;

}

function detail(id,opt=0){

const p=productsData.find(x=>x.id===id);

if(!p)return;

selected=p;
selectedOption=opt;

let optionHtml="";

if(p.options){

optionHtml=`
<div class="options">
${p.options.map((o,i)=>`
<button
class="option ${i===selectedOption?"active":""}"
onclick="selectOption(event,'${p.id}',${i})">
${o[0]}
</button>
`).join("")}
</div>
`;

}

const current=p.options?p.options[selectedOption]:[
p.weight,
p.price,
p.img
];

$("homePage").style.display="none";
$("productPage").style.display="block";

$("productPage").innerHTML=`

<div class="detail-card">

<div class="detail-img">
<img src="${current[2]||p.img}"
alt="${p.name}"
onerror="this.style.display='none'">
</div>

<div class="detail-body">

<div class="detail-title">${p.name}</div>

<div class="detail-en">${p.en}</div>

<div class="detail-price">${money(current[1]||p.price)}</div>

${optionHtml}

<button class="detail-add" onclick="addSelected()">
🛒 أضف للسلة
</button>

<button class="back" onclick="home()">
← العودة
</button>

</div>
</div>
`;

window.scrollTo({top:0,behavior:"smooth"});

}

function selectOption(e,id,index){

e.stopPropagation();

detail(id,index);

}

function addSelected(){

if(!selected)return;

const option=selected.options
?selected.options[selectedOption]
:null;

const item={
id:selected.id,
name:selected.name,
en:selected.en,
option:option?option[0]:(selected.weight||""),
price:option?option[1]:selected.price,
img:option?option[2]:selected.img,
qty:1
};

add(item);

openCart();

}

function quick(e,id){

e.stopPropagation();

const p=productsData.find(x=>x.id===id);

if(!p)return;

const option=p.options?p.options[0]:null;

add({
id:p.id,
name:p.name,
en:p.en,
option:option?option[0]:(p.weight||""),
price:option?option[1]:p.price,
img:option?option[2]:p.img,
qty:1
});

}

function add(item){

const existing=cart.find(x=>
x.id===item.id &&
x.option===item.option
);

if(existing){

existing.qty++;

}else{

cart.push(item);

}

save();

toast("تمت إضافة المنتج إلى السلة");

}

function updateCartCount(){

const total=cart.reduce((sum,x)=>sum+x.qty,0);

$("cartCount").textContent=total;

}

function openCart(){

$("cartPanel").style.display="block";

renderCart();

}

function closeCart(){

$("cartPanel").style.display="none";

}

function renderCart(){

if(!cart.length){

$("cartItems").innerHTML=`
<div class="empty">
🛒<br>
السلة فارغة
</div>
`;

$("cartSummary").innerHTML="";

return;

}

$("cartItems").innerHTML=cart.map((x,i)=>`

<div class="cart-item">

<img class="cart-item-img"
src="${x.img}"
alt="${x.name}">

<div class="cart-item-info">

<div class="cart-item-name">
${x.name}
</div>

<div class="cart-item-option">
${x.option||""}
</div>

<div style="font-weight:bold;color:var(--g);margin-top:5px">
${money(x.price)}
</div>

</div>

<div class="qty">

<button onclick="changeQty(${i},-1)">−</button>

<strong>${x.qty}</strong>

<button onclick="changeQty(${i},1)">+</button>

</div>

</div>

`).join("");

const subtotal=cart.reduce(
(sum,x)=>sum+(x.price*x.qty),0
);

const delivery=2;

const total=subtotal+delivery;

$("cartSummary").innerHTML=`

<div class="cart-summary">

<div class="sum-row">
<span>المجموع</span>
<strong>${money(subtotal)}</strong>
</div>

<div class="sum-row">
<span>التوصيل</span>
<strong>${money(delivery)}</strong>
</div>

<div class="sum-row total">
<span>الإجمالي</span>
<strong>${money(total)}</strong>
</div>

<button class="checkout" onclick="checkout()">
إتمام الطلب
</button>

</div>
`;

}

function changeQty(index,delta){

cart[index].qty+=delta;

if(cart[index].qty<=0){
cart.splice(index,1);
}

save();
renderCart();

}

function checkout(){

if(!cart.length){

toast("السلة فارغة");

return;

}

const subtotal=cart.reduce(
(sum,x)=>sum+(x.price*x.qty),0
);

const delivery=2;
const total=subtotal+delivery;

const items=cart.map(x=>
`${x.name} ${x.option?"("+x.option+")":""} ×${x.qty} = ${money(x.price*x.qty)}`
).join("\n");

const form=document.createElement("form");

form.method="POST";
form.action="https://api.web3forms.com/submit";
form.target="_blank";

const fields={

access_key:"YOUR_WEB3FORMS_ACCESS_KEY",

subject:"طلب جديد من Tekram",

from_name:"Tekram",

message:
`طلب جديد من موقع Tekram

${items}

المجموع: ${money(subtotal)}
التوصيل: ${money(delivery)}
الإجمالي: ${money(total)}`

};

Object.entries(fields).forEach(([name,value])=>{

const input=document.createElement("input");

input.type="hidden";
input.name=name;
input.value=value;

form.appendChild(input);

});

document.body.appendChild(form);

form.submit();

form.remove();

}

function toggleFav(id){

if(favorites.includes(id)){

favorites=favorites.filter(x=>x!==id);

toast("تمت إزالة المنتج من المفضلة");

}else{

favorites.push(id);

toast("تمت إضافة المنتج للمفضلة");

}

save();
render();

}

function showFavorites(){

category="الكل";
onlyFav=true;

$("homePage").style.display="block";
$("productPage").style.display="none";

render();

window.scrollTo({top:0,behavior:"smooth"});

}

function home(){

$("productPage").style.display="none";
$("homePage").style.display="block";

category="الكل";
onlyFav=false;

render();

nav(0);

window.scrollTo({top:0,behavior:"smooth"});

}

function goProducts(){

$("productPage").style.display="none";
$("homePage").style.display="block";

category="الكل";
onlyFav=false;

render();

window.scrollTo({top:0,behavior:"smooth"});

}

function scrollProducts(){

$("products").scrollIntoView({
behavior:"smooth"
});

}

function openMenu(){

$("menu").style.display="block";

}

function closeMenu(){

$("menu").style.display="none";

}

function nav(n){

document.querySelectorAll(".nav-btn")
.forEach((b,i)=>{
b.classList.toggle("active",i===n);
});

if(n===0){

home();

}

if(n===1){

goProducts();

}

if(n===2){

showFavorites();

}

if(n===3){

openCart();

}

}

render();

</script>

</body>
</html>

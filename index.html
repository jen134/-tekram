<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تِكرَم | Tekram</title>

<style>
:root{
--g:#183d30;--g2:#244f3e;--c:#f7f0e4;--c2:#eee4d3;
--o:#df5035;--gold:#e5aa45;--w:#fffdf8;--m:#77786f;--b:#e5dac8
}
*{box-sizing:border-box}
body{
margin:0;background:var(--c);color:#222;
font-family:Arial,Tahoma,sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
background:var(--g);
position:sticky;
top:0;
z-index:30;
padding:8px 4%;
box-shadow:0 2px 12px #0002
}
.brand-home{
display:block;
width:100%;
text-align:center
}
.brand-home img{
width:100%;
max-width:430px;
height:72px;
object-fit:contain;
display:block;
margin:auto
}
.head-actions{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
margin-top:4px
}
.icon{
border:0;
background:#ffffff18;
color:#fff;
width:42px;
height:38px;
border-radius:12px;
font-size:20px;
position:relative
}
.count{
position:absolute;
top:-5px;
right:-5px;
background:var(--o);
color:#fff;
width:18px;
height:18px;
border-radius:50%;
font-size:11px;
display:grid;
place-items:center
}
.search{
padding:12px 5%;
background:var(--w);
border-bottom:1px solid var(--b)
}
.search input{
width:100%;
max-width:900px;
display:block;
margin:auto;
padding:13px 18px;
border:1px solid var(--b);
border-radius:18px;
outline:0;
background:#fff
}
main{max-width:1250px;margin:auto;padding:18px 5% 90px}
.hero{
background:var(--g);
color:white;
border-radius:25px;
padding:35px 25px;
margin-bottom:25px;
text-align:center;
overflow:hidden
}
.hero h1{margin:0 0 10px;font-size:30px}
.hero p{margin:0 0 20px;color:#e9eee9}
.btn{
border:0;
background:var(--o);
color:#fff;
padding:12px 22px;
border-radius:14px;
font-weight:bold
}
.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:25px 0 14px
}
.section-title h2{margin:0;color:var(--g)}
.categories{
display:flex;
gap:8px;
overflow:auto;
padding:3px 0 12px;
scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.cat{
white-space:nowrap;
border:1px solid var(--b);
background:#fff;
padding:9px 15px;
border-radius:20px;
color:var(--g)
}
.cat.active{
background:var(--g);
color:#fff
}
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}
.card{
background:#fff;
border:1px solid var(--b);
border-radius:18px;
overflow:hidden;
position:relative;
box-shadow:0 3px 12px #00000008
}
.pic{
height:190px;
background:#faf8f2;
display:grid;
place-items:center;
overflow:hidden
}
.pic img{
width:100%;
height:100%;
object-fit:contain
}
.pic .emoji{font-size:70px}
.card-body{padding:13px}
.card h3{margin:0 0 5px;font-size:17px;color:var(--g)}
.en{font-size:11px;color:#999;direction:ltr;text-align:right}
.weight{font-size:12px;color:var(--m);margin:7px 0}
.price{
font-weight:bold;
font-size:19px;
color:var(--o)
}
.card-actions{
display:flex;
gap:7px;
margin-top:10px
}
.card-actions button{
flex:1;
border:0;
border-radius:11px;
padding:9px
}
.add{background:var(--g);color:white}
.more{background:var(--c2);color:var(--g)}
.fav{
position:absolute;
top:9px;
left:9px;
border:0;
background:#fff;
width:32px;
height:32px;
border-radius:50%;
font-size:18px;
z-index:2
}
.empty{
text-align:center;
padding:50px 10px;
color:var(--m)
}
.offers{display:none}
.detail{
display:none;
background:#fff;
border-radius:22px;
padding:20px;
margin-top:15px
}
.detail.show{display:block}
.detail-img{
height:300px;
display:grid;
place-items:center;
background:#faf8f2;
border-radius:18px;
overflow:hidden
}
.detail-img img{
width:100%;
height:100%;
object-fit:contain
}
.detail h1{color:var(--g)}
.options{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:15px 0
}
.opt{
border:1px solid var(--b);
background:#fff;
padding:9px 13px;
border-radius:12px
}
.opt.active{
background:var(--g);
color:white
}
.panel{
position:fixed;
inset:0;
background:#0006;
z-index:100;
display:none
}
.panel.show{display:block}
.sheet{
position:absolute;
right:0;
top:0;
height:100%;
width:min(430px,94%);
background:var(--w);
padding:20px;
overflow:auto
}
.sheet-head{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--b);
padding-bottom:12px
}
.close{
border:0;
background:var(--c2);
border-radius:10px;
width:38px;
height:38px
}
.cart-item{
display:flex;
gap:10px;
align-items:center;
padding:13px 0;
border-bottom:1px solid var(--b)
}
.cart-item img{
width:65px;
height:65px;
object-fit:contain;
background:#faf8f2;
border-radius:10px
}
.cart-info{flex:1}
.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:6px
}
.qty button{
border:0;
background:var(--c2);
width:27px;
height:27px;
border-radius:8px
}
.total{
margin-top:18px;
padding:15px;
background:var(--c2);
border-radius:15px
}
.total div{
display:flex;
justify-content:space-between;
margin:7px 0
}
.form input,.form textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid var(--b);
border-radius:12px;
outline:0
}
.form textarea{min-height:80px;resize:vertical}
.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#fff;
border-top:1px solid var(--b);
display:flex;
justify-content:space-around;
align-items:center;
z-index:40
}
.bottom button{
border:0;
background:none;
color:var(--m);
font-size:12px
}
.bottom span{
display:block;
font-size:21px;
margin-bottom:2px
}
.menu-list button{
display:block;
width:100%;
border:0;
background:none;
padding:16px 5px;
border-bottom:1px solid var(--b);
text-align:right;
color:var(--g)
}
footer{
background:var(--g);
color:#fff;
text-align:center;
padding:25px;
margin-bottom:65px
}
@media(max-width:900px){
.grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
.brand-home img{height:65px;max-width:100%}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
.pic{height:165px}
.card h3{font-size:15px}
.card-body{padding:10px}
main{padding-left:4%;padding-right:4%}
.hero h1{font-size:24px}
}
</style>
</head>

<body>

<header>
  <a class="brand-home" href="#" onclick="home();return false">
    <img src="./tekram-logo.png" alt="تِكرَم | Tekram">
  </a>

  <div class="head-actions">
    <button class="icon" onclick="focusSearch()">⌕</button>
    <button class="icon" onclick="openMenu()">☰</button>
    <button class="icon cart-top" onclick="openCart()">
      🛒<b id="count" class="count">0</b>
    </button>
  </div>
</header>

<div class="search">
  <input id="search" type="search" placeholder="شو عم تفتّش؟" oninput="render()">
</div>

<main>

<section id="homePage">

<div class="hero">
  <h1>كل احتياجاتك اليومية بمكان واحد.</h1>
  <p>تِكرَم — من بيتنا لبيتك</p>
  <button class="btn" onclick="scrollProducts()">تصفح المنتجات</button>
</div>

<div id="offers"></div>

<div class="section-title">
  <h2>المنتجات</h2>
</div>

<div id="categories" class="categories"></div>
<div id="products" class="grid"></div>

</section>

<section id="detailPage" class="detail"></section>

</main>

<footer>
  <b>تِكرَم | Tekram</b>
  <div style="margin-top:6px;font-size:13px">من بيتنا لبيتك</div>
</footer>

<div id="cartPanel" class="panel">
  <div class="sheet">
    <div class="sheet-head">
      <h2>سلة المشتريات</h2>
      <button class="close" onclick="closePanels()">×</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="checkout()">
      إتمام الطلب
    </button>
  </div>
</div>

<div id="menuPanel" class="panel">
  <div class="sheet">
    <div class="sheet-head">
      <h2>القائمة</h2>
      <button class="close" onclick="closePanels()">×</button>
    </div>

    <div class="menu-list">
      <button onclick="menuHome()">🏠 الرئيسية</button>
      <button onclick="menuProducts()">🛒 المنتجات</button>
      <button onclick="menuOffers()">🏷️ العروض</button>
      <button onclick="menuFavorites()">❤️ المفضلة</button>
      <button onclick="menuCart()">🛍️ سلة المشتريات</button>
    </div>
  </div>
</div>

<div id="checkoutPanel" class="panel">
  <div class="sheet">
    <div class="sheet-head">
      <h2>إتمام الطلب</h2>
      <button class="close" onclick="closePanels()">×</button>
    </div>

    <form class="form" onsubmit="sendOrder(event)">
      <input id="customerName" required placeholder="الاسم">
      <input id="customerPhone" required placeholder="رقم الهاتف">
      <input id="customerArea" required placeholder="المنطقة">
      <input id="customerAddress" required placeholder="العنوان">
      <textarea id="customerNotes" placeholder="ملاحظات إضافية"></textarea>

      <div id="checkoutTotal" class="total"></div>

      <button class="btn" style="width:100%;margin-top:10px">
        إرسال الطلب
      </button>
    </form>
  </div>
</div>

<nav class="bottom">
  <button onclick="home()"><span>🏠</span>الرئيسية</button>
  <button onclick="menuProducts()"><span>🛒</span>الأقسام</button>
  <button onclick="favoritesPage()"><span>❤️</span>المفضلة</button>
  <button onclick="openCart()"><span>🛍️</span>السلة</button>
</nav>

let liked=favs.includes(p.id);
let image=p.img?
`<img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">`:
`<span class="emoji">${p.icon||"🛒"}</span>`;

return `
<article class="card">
<button class="fav" onclick="toggleFav('${p.id}')">${liked?"❤️":"♡"}</button>
<div class="pic">${image}</div>
<div class="card-body">
<h3>${p.name}</h3>
<div class="en">${p.en}</div>
<div class="weight">${p.weight}</div>
<div class="price">$${p.price.toFixed(2)}</div>
<div class="card-actions">
<button class="more" onclick="detail('${p.id}')">التفاصيل</button>
<button class="add" onclick="quick('${p.id}')">أضف للسلة</button>
</div>
</div>
</article>`
}

function render(){
categoriesHTML();
let q=document.getElementById("search").value.trim().toLowerCase();

let list=products.filter(p=>
(currentCat==="الكل"||p.cat===currentCat)&&
(!q||(p.name+" "+p.en).toLowerCase().includes(q))
);

document.getElementById("products").innerHTML=
list.length?list.map(card).join(""):`<div class="empty">ما لقينا منتجات مطابقة.</div>`
}

function choose(c){
currentCat=c;
document.getElementById("detailPage").classList.remove("show");
document.getElementById("homePage").style.display="block";
render();
scrollProducts()
}

function scrollProducts(){
document.getElementById("products").scrollIntoView({behavior:"smooth",block:"start"})
}

function toggleFav(id){
favs.includes(id)?
favs=favs.filter(x=>x!==id):
favs.push(id);
save();
render()
}

function favoritesPage(){
closePanels();
document.getElementById("homePage").style.display="block";
document.getElementById("detailPage").classList.remove("show");
currentCat="الكل";

let list=products.filter(p=>favs.includes(p.id));
document.getElementById("products").innerHTML=
list.length?list.map(card).join(""):`<div class="empty">ما عندك منتجات بالمفضلة ❤️</div>`;

document.getElementById("categories").innerHTML="";
window.scrollTo({top:0,behavior:"smooth"})
}

function quick(id){
let p=products.find(x=>x.id===id);
add(p,0)
}

function detail(id){
let p=products.find(x=>x.id===id);
if(!p)return;

selectedProduct=p;
selectedOption=0;

document.getElementById("homePage").style.display="none";

let img=p.img?
`<img id="detailImg" src="${p.img}" alt="${p.name}">`:
`<span class="emoji">${p.icon||"🛒"}</span>`;

let opts=p.options?
`<div class="options">${p.options.map((o,i)=>
`<button class="opt ${i===0?"active":""}" onclick="selectOption(${i})">${o[0]} — $${o[1].toFixed(2)}</button>`
).join("")}</div>`:"";

document.getElementById("detailPage").innerHTML=`
<button class="more" style="border:0;padding:9px 14px;border-radius:10px" onclick="home()">← رجوع</button>
<div class="detail-img">${img}</div>
<h1>${p.name}</h1>
<div class="en">${p.en}</div>
<p>${p.weight}</p>
${opts}
<div class="price" id="detailPrice">$${p.price.toFixed(2)}</div>
<button class="btn" style="width:100%;margin-top:15px" onclick="addSelected()">أضف للسلة</button>
`;

document.getElementById("detailPage").classList.add("show");
window.scrollTo({top:0,behavior:"smooth"})
}

function selectOption(i){
selectedOption=i;
let o=selectedProduct.options[i];
document.querySelectorAll(".opt").forEach((x,n)=>x.classList.toggle("active",n===i));
document.getElementById("detailPrice").textContent="$"+o[1].toFixed(2);
let img=document.getElementById("detailImg");
if(img&&o[2]&&!o[2].startsWith("🥛")&&!o[2].startsWith("🍑")){
img.src=o[2]
}
}

function addSelected(){
add(selectedProduct,selectedOption)
}

function add(p,opt=0){
let option=p.options?.[opt];
let name=p.name+(option?" - "+option[0]:"");
let price=option?option[1]:p.price;
let img=option?.[2]||p.img||"";

let found=cart.find(x=>x.id===p.id&&x.opt===opt);

if(found)found.qty++;
else cart.push({
id:p.id,
opt,
name,
price,
img,
qty:1
});

save();
openCart()
}

function updateCart(){
document.getElementById("count").textContent=
cart.reduce((a,x)=>a+x.qty,0);

let box=document.getElementById("cartItems");

if(!cart.length){
box.innerHTML=`<div class="empty">السلة فاضية 🛒</div>`;
document.getElementById("cartTotal").innerHTML="";
return
}

box.innerHTML=cart.map((x,i)=>`
<div class="cart-item">
${x.img?`<img src="${x.img}" onerror="this.style.display='none'">`:""}
<div class="cart-info">
<b>${x.name}</b>
<div>$${x.price.toFixed(2)}</div>
<div class="qty">
<button onclick="qty(${i},-1)">−</button>
<b>${x.qty}</b>
<button onclick="qty(${i},1)">+</button>
<button onclick="removeItem(${i})">🗑️</button>
</div>
</div>
</div>
`).join("");

let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
document.getElementById("cartTotal").innerHTML=`
<div class="total">
<div><span>المجموع</span><b>$${sub.toFixed(2)}</b></div>
<div><span>التوصيل</span><b>$${DELIVERY.toFixed(2)}</b></div>
<div><span>المجموع النهائي</span><b>$${(sub+DELIVERY).toFixed(2)}</b></div>
</div>`
}

function qty(i,n){
cart[i].qty+=n;
if(cart[i].qty<=0)cart.splice(i,1);
save()
}

function removeItem(i){
cart.splice(i,1);
save()
}

function openCart(){
closePanels();
document.getElementById("cartPanel").classList.add("show");
updateCart()
}

function checkout(){
if(!cart.length)return;
closePanels();

let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);

document.getElementById("checkoutTotal").innerHTML=`
<div><span>المجموع</span><b>$${sub.toFixed(2)}</b></div>
<div><span>التوصيل</span><b>$${DELIVERY.toFixed(2)}</b></div>
<div><span>الإجمالي</span><b>$${(sub+DELIVERY).toFixed(2)}</b></div>
`;

document.getElementById("checkoutPanel").classList.add("show")
}

function closePanels(){
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"))
}

function openMenu(){
closePanels();
document.getElementById("menuPanel").classList.add("show")
}

function menuHome(){
closePanels();
home()
}

function menuProducts(){
closePanels();
home();
scrollProducts()
}

function menuOffers(){
closePanels();
home();
scrollProducts()
}

function menuFavorites(){
favoritesPage()
}

function menuCart(){
openCart()
}

function home(){
closePanels();
document.getElementById("homePage").style.display="block";
document.getElementById("detailPage").classList.remove("show");
document.getElementById("search").value="";
currentCat="الكل";
render();
window.scrollTo({top:0,behavior:"smooth"})
}

function sendOrder(e){
e.preventDefault();

if(!cart.length)return;

let order=cart.map(x=>
`${x.name} × ${x.qty} = $${(x.price*x.qty).toFixed(2)}`
).join("\n");

let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
let total=sub+DELIVERY;

let data={
access_key:KEY,
subject:"طلب جديد من Tekram",
name:document.getElementById("customerName").value,
phone:document.getElementById("customerPhone").value,
area:document.getElementById("customerArea").value,
address:document.getElementById("customerAddress").value,
notes:document.getElementById("customerNotes").value,
order,
subtotal:"$"+sub.toFixed(2),
delivery:"$"+DELIVERY.toFixed(2),
total:"$"+total.toFixed(2)
};

fetch("https://api.web3forms.com/submit",{
method:"POST",
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify(data)
})
.then(r=>r.json())
.then(r=>{
if(r.success){
alert("تم إرسال طلبك بنجاح ❤️");
cart=[];
save();
document.querySelector("form").reset();
closePanels();
home()
}else{
alert("صار خطأ، جربي مرة ثانية.")
}
})
.catch(()=>alert("تعذر إرسال الطلب."))
}

updateCart();
render();
</script>

</body>
</html>

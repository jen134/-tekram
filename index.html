<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تِكرَم | Tekram</title>
<style>
:root{
--g:#183d30;--g2:#244f3e;--bg:#f7f0e4;--w:#fffdf8;
--o:#df5035;--y:#e5aa45;--muted:#77786f;--b:#e5dac8
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--g);font-family:Arial,Tahoma,sans-serif}
header{
position:sticky;top:0;z-index:20;height:64px;background:var(--w);
display:flex;align-items:center;justify-content:space-between;
padding:0 16px;border-bottom:1px solid var(--b)
}
.logo{font-size:22px;font-weight:900;position:absolute;left:50%;transform:translateX(-50%)}
.icon{display:block!important;visibility:visible!important;border:0;background:none;font-size:25px;color:var(--g);padding:8px}
.actions{display:flex;gap:5px;align-items:center}
.cart{position:relative}
.count{position:absolute;top:0;right:0;background:var(--o);color:white;border-radius:50%;font-size:10px;padding:3px 6px}
.hero{text-align:center;padding:45px 20px;background:var(--g);color:white}
.hero h1{font-size:38px;margin:5px}
.hero p{margin:10px 0 22px;color:#eee}
.hero button,.btn{
border:0;border-radius:12px;padding:12px 20px;background:var(--y);
color:var(--g);font-weight:bold
}
section{padding:28px 16px;max-width:1100px;margin:auto}
h2{margin-top:0}
.cats{display:flex;gap:8px;overflow:auto;margin-bottom:20px}
.cats button{
white-space:nowrap;border:1px solid var(--b);background:var(--w);
padding:9px 15px;border-radius:20px;color:var(--g)
}
.cats .active{background:var(--g);color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--w);border:1px solid var(--b);border-radius:16px;padding:10px}
.pic{
width:100%;aspect-ratio:1;background:#eee4d3;border-radius:12px;
display:flex;align-items:center;justify-content:center;font-size:55px;
overflow:hidden
}
.pic img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:15px;margin:10px 0 4px}
.en{font-size:11px;color:var(--muted)}
.price{font-size:18px;font-weight:bold;margin-top:8px}
.menu{
position:fixed;z-index:101;left:-320px;top:0;width:300px;max-width:90%;
height:100vh;background:var(--w);padding:20px;
transition:.3s;box-shadow:8px 0 30px #0002
}
.menu.open{left:0}
.menu button{
display:block;width:100%;border:0;background:none;padding:15px;
text-align:right;font-weight:bold;color:var(--g);font-size:15px
}
.menu .close{text-align:left;font-size:25px}
#overlay{
display:none;position:fixed;z-index:100;inset:0;background:#0005
}
footer{text-align:center;padding:30px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<button class="icon" onclick="openMenu()">☰</button>
<div class="logo">تِكرَم</div>
<div class="actions">
<button class="icon" onclick="openCart()">🛒<span id="count" class="count">0</span></button>
</div>
</header>
<div id="overlay" onclick="closePanels()"></div>
<div id="menu" class="menu">
<button class="close" onclick="closeMenu()">×</button>
<button onclick="home()">🏠 الرئيسية</button>
<button onclick="productsPage()">🛍️ المنتجات</button>
<button onclick="offersPage()">🔥 العروض</button>
<button onclick="favoritesPage()">❤️ المفضلة</button>
<button onclick="openCart()">🛒 سلة المشتريات</button>
</div>
<section class="hero">
<h1>أهلاً بكم في تِكرَم</h1>
<p>كل حاجات البيت بمكان واحد</p>
<button onclick="productsPage()">تصفّح المنتجات</button>
</section>
<section id="products">
<h2>منتجاتنا</h2>
<div id="cats" class="cats"></div>
<div id="grid" class="grid"></div>
</section>
<footer>تِكرَم | Tekram</footer>
<script>
const $=x=>document.getElementById(x);
const products=[
["coffee-no","قهوة نجار دون هال","Najjar Coffee No Cardamom",3.35,"180 غ / 450 غ","./najjar-coffee-no-cardamom-180g.JPG"],
["coffee-card","قهوة نجار مع هال","Najjar Coffee with Cardamom",3.55,"180 غ / 450 غ","./najjar-coffee-with-cardamom-180g.JPG"],
["ghazal","جبنة الغزال","Al Ghazal Cheese",2.70,"370 غ / 1.5 كغ","🧀"],
["almarai","جبنة المراعي","Almarai Cheese",1.70,"300 غ","🧀"],
["greek","يوغرت تعنايل غريك","Taanayel Greek Yogurt",1.25,"سادة / فريز / توت / دراق","🥛"],
["corn","ذرة حلوة لا بيلا","La Bella Sweet Corn",.85,"340 غ","./la-bella-sweet-corn-340g.JPG"],
["red","نجار الأحمر","Najjar Red",3,"95 غ / 190 غ","./najjar-red-95g.JPG"],
["mate","كريمر كوفي ميت","Coffee Mate",2.50,"450 غ","./coffee-mate-450g.JPG"],
["picon","بيكون جبنة","Picon Cheese",2.50,"×16 / ×24","./Picon-cheese-*16.JPG"],
["picon8","بيكون سِمبلي ×8","Picon Cheese Simply ×8",.90,"×8","./Picon-cheese-simply-*8.JPG"],
["trobika","تروبيكا كابتشينو","Trobika Cappuccino",4.55,"20 + 2","./Trobika-Cappuccino-20+2.JPG"],
["nescafe","نسكافيه كلاسيك 2 في 1","Nescafé Classic 2 in 1",5.25,"2 in 1","./Nescafe-classic—2in1.JPG"],
["cream","كريمة طبخ نيو بارك","New Park Cooking Cream",1,"160 مل / 1 لتر","./New-park-cooking-cream -160ml.JPG"]
];
const cats=["الكل","مشروبات","ألبان وأجبان","مواد غذائية","مواد تنظيف","بلاستيك"];
let active="الكل",cart=0;
function render(){
$("cats").innerHTML=cats.map(c=>`<button class="${c==active?"active":""}" onclick="filter('${c}')">${c}</button>`).join("");
let p=active=="الكل"?products:products.filter(x=>x[1].includes(active));
$("grid").innerHTML=p.map(x=>`
<div class="card">
<div class="pic">${x[5]?.startsWith("./")?`<img src="${x[5]}" onerror="this.style.display='none';this.parentElement.innerHTML='🛒'">`:x[5]}</div>
<h3>${x[1]}</h3>
<div class="en">${x[2]}</div>
<div class="price">$${x[3].toFixed(2)}</div>
</div>`).join("");
}
function filter(c){active=c;render()}
function openMenu(){closePanels();$("menu").classList.add("open");$("overlay").style.display="block"}
function closeMenu(){$("menu").classList.remove("open")}
function closePanels(){closeMenu();$("overlay").style.display="none"}
function home(){closePanels();scrollTo(0,0)}
function productsPage(){closePanels();$("products").scrollIntoView({behavior:"smooth"})}
function offersPage(){closePanels();alert("العروض ستظهر هنا قريباً 🔥")}
function favoritesPage(){closePanels();alert("المفضلة ❤️")}
function openCart(){closePanels();alert("السلة 🛒")}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تِكرَم | Tekram</title>
<style>
:root{
--g:#183d30;--g2:#244f3e;--c:#f7f0e4;--c2:#eee4d3;
--o:#df5035;--gold:#e5aa45;--w:#fffdf8;--m:#77786f;--b:#e5dac8
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--c);color:var(--g);line-height:1.6}
button,input,textarea{font-family:inherit}button{cursor:pointer}
header{background:var(--g);padding:15px 5%;position:sticky;top:0;z-index:20}
.head{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font:900 28px Georgia;color:white;text-align:center}
.logo small{display:block;font:11px Tahoma;color:var(--gold)}
.icons{display:flex;gap:8px}
.icon{width:45px;height:45px;border:0;border-radius:50%;background:var(--w);color:var(--g);font-size:20px}
.cart-top{position:relative}.count{position:absolute;top:-4px;right:-3px;background:var(--o);color:white;border-radius:20px;padding:1px 6px;font-size:10px}
.search-wrap{background:var(--g);padding:0 5% 20px}
.search{max-width:1250px;margin:auto;background:var(--w);height:50px;border-radius:30px;display:flex;align-items:center;padding:0 18px;gap:8px}
.search input{width:100%;border:0;outline:0;background:none;font-size:14px}
.hero-wrap,.section{padding:25px 5%}.hero{max-width:1250px;margin:auto;min-height:350px;background:var(--g);border-radius:30px;color:white;position:relative;overflow:hidden;display:flex;align-items:center}
.hero:before{content:"";position:absolute;width:400px;height:400px;border:50px solid #244a3a;border-radius:50%;right:-100px;top:-240px}
.hero-text{padding:40px 6%;max-width:650px;position:relative;z-index:2}
.hero-small{color:var(--gold);font-weight:bold}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.1;margin:10px 0 18px}.hero h1 span{color:#f4b04b}.hero p{color:#eee;margin-bottom:22px;font-size:14px}
.hero button{border:0;background:var(--o);color:white;padding:13px 22px;border-radius:25px;font-weight:bold}
.basket{position:absolute;left:8%;bottom:35px;width:270px;height:150px;background:#35634e;border-radius:25px 25px 55px 55px;border:8px solid #2c5644}
.basket i{position:absolute;width:65px;height:75px;border-radius:10px;background:white;box-shadow:0 6px 12px #0003}
.i1{background:#d93627!important;left:25px;top:-50px}.i2{background:#e8a936!important;right:25px;top:-65px}.i3{left:105px;top:-80px}
.section{max-width:1250px;margin:auto;padding-bottom:120px}
.title{margin-bottom:20px}.line{width:45px;height:3px;background:var(--g);margin-bottom:10px}.title h2{font-size:30px}.title p{color:var(--m);font-size:13px}
.categories{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.categories button{border:1px solid var(--b);background:var(--w);color:var(--g);padding:8px 14px;border-radius:20px;font-size:11px;font-weight:bold}
.categories .active{background:var(--g);color:white}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{position:relative;background:#fffdf8;border:1px solid var(--b);border-radius:20px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px)}
.pic{margin:9px;aspect-ratio:1;background:#eee5d6;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:65px}
.pic img{width:100%;height:100%;object-fit:contain}
.info{padding:7px 12px 14px}.badge{display:inline-block;background:#f3c97d;color:#5c3f17;padding:3px 8px;border-radius:15px;font-size:9px;font-weight:bold}
.name{font-size:14px;font-weight:bold;margin-top:5px}.en{font-size:9px;color:var(--m)}.weight{font-size:10px;color:#555;margin-top:3px}
.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.price{font-size:18px;font-weight:bold;direction:ltr}
.add{width:35px;height:35px;border:0;border-radius:50%;background:var(--g);color:white}
.fav{position:absolute;top:15px;left:15px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:#fffdf8ee;color:var(--g);font-size:19px;box-shadow:0 2px 8px #0002}.fav.on{color:var(--o)}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--m)}
#productPage{display:none;padding:30px 5% 120px}
.detail{max-width:1000px;margin:auto;background:var(--w);border-radius:25px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.detail-img{min-height:430px;background:#eee5d6;display:flex;align-items:center;justify-content:center;font-size:130px}.detail-img img{width:100%;height:100%;min-height:430px;object-fit:contain}
.detail-info{padding:40px;display:flex;flex-direction:column;justify-content:center}.detail-cat{color:var(--o);font-size:12px;font-weight:bold}.detail-name{font-size:32px;font-weight:bold}.detail-en{color:var(--m);font-size:12px}.options{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.option{border:1px solid var(--g);background:none;color:var(--g);padding:8px 13px;border-radius:10px;font-weight:bold}.option.sel{background:var(--g);color:white}.detail-price{font-size:30px;font-weight:bold;direction:ltr}.detail-desc{font-size:13px;color:#59625b;margin:10px 0 18px}.detail-add,.back{border:0;padding:13px;border-radius:13px;font-weight:bold;font-size:15px}.detail-add{background:var(--o);color:white}.back{background:var(--g);color:white;margin-top:8px}
.bottom-nav{position:fixed;z-index:50;bottom:14px;left:50%;transform:translateX(-50%);width:min(850px,94%);background:#fffdf8ee;backdrop-filter:blur(10px);border:1px solid var(--b);border-radius:30px;padding:8px 15px;display:flex;justify-content:space-around;box-shadow:0 8px 30px #0002}
.bottom-nav button{border:0;background:none;color:var(--m);font-size:10px;font-weight:bold}.bottom-nav span{display:block;font-size:21px}.bottom-nav .active{color:var(--o)}
.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:100}
.panel{position:fixed;z-index:101;right:-430px;top:0;width:410px;max-width:94%;height:100vh;background:var(--w);transition:.3s;display:flex;flex-direction:column}
.panel-head{padding:18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between}.close{border:0;background:var(--c2);border-radius:10px;width:36px;height:36px;font-size:20px}
.panel-body{flex:1;overflow:auto;padding:18px}.cart-item{padding:14px 0;border-bottom:1px solid var(--b)}.cart-row{display:flex;justify-content:space-between;gap:8px}.cart-price{color:var(--o);direction:ltr}.controls{display:flex;align-items:center;gap:8px;margin-top:8px}.qty{width:28px;height:28px;border:0;border-radius:8px;background:var(--g);color:white}.remove{border:0;background:none;color:var(--o);margin-right:auto;font-size:11px}
.panel-foot{padding:17px;border-top:1px solid var(--b)}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin-bottom:12px}.checkout{width:100%;border:0;background:var(--o);color:white;padding:13px;border-radius:13px;font-weight:bold}
.form{margin-bottom:12px}.form label{font-size:12px;font-weight:bold}.input{width:100%;border:1px solid var(--b);border-radius:10px;padding:10px;margin-top:4px;outline:0}.area{height:65px;resize:none}
.summary{background:var(--c);padding:12px;border-radius:13px;margin-top:12px}.summary-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.final{border-top:1px solid var(--b);padding-top:10px;font-weight:bold;font-size:17px}
footer{background:var(--g);color:white;text-align:center;padding:40px 20px 110px}.footer-logo{font:28px Georgia;color:var(--gold)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
.hero{min-height:370px}.hero-text{padding:35px 7%}.hero h1{font-size:40px}.basket{display:none}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}.name{font-size:12px}.price{font-size:16px}.add{width:32px;height:32px}
.detail{grid-template-columns:1fr}.detail-img,.detail-img img{min-height:300px}.detail-info{padding:25px}.detail-name{font-size:28px}
}
</style>
</head>
<body>
<header>
<div class="head">
<div class="icons">
<button class="icon cart-top" onclick="openCart()">🛒<b id="count" class="count">0</b></button>
</div>
<a class="logo" href="#" onclick="home();return false">
TEKRAM
<small>من بيتنا لبيتك</small>
</a>
<div class="icons">
<button class="icon" onclick="search.focus()">⌕</button>
<button class="icon" onclick="categoriesPage()">☰</button>
</div>
</div>
</header>
<div class="search-wrap">
<div class="search">
<span>⌕</span>
<input id="search" placeholder="إبحث عن منتج..." oninput="render()">
</div>
</div>
<main id="homePage">
<section class="hero-wrap">
<div class="hero">
<div class="hero-text">
<div class="hero-small">✦ من حارتنا لبيتك</div>
<h1>كل احتياجاتك اليومية<br><span>بمكان واحد.</span></h1>
<p>منتجات مختارة بعناية من بيتنا لبيتك، بأسعار واضحة وتوصيل قريب.</p>
<button onclick="scrollProducts()">تصفّح المنتجات ←</button>
</div>
<div class="basket">
<i class="i1"></i><i class="i2"></i><i class="i3"></i>
</div>
</div>
</section>
<section class="section" id="products">
<div class="title">
<div class="line"></div>
<h2 id="title">منتجاتنا</h2>
<p id="sub">اختيارات من تِكرَم</p>
</div>
<div id="cats" class="categories"></div>
<div id="grid" class="grid"></div>
</section>
</main>
<section id="productPage">
<div class="detail">
<div id="dimg" class="detail-img"></div>
<div class="detail-info">
<div id="dcat" class="detail-cat"></div>
<div id="dname" class="detail-name"></div>
<div id="den" class="detail-en"></div>
<div id="options" class="options"></div>
<div id="dweight"></div>
<div id="dprice" class="detail-price"></div>
<div id="ddesc" class="detail-desc"></div>

🛒 أضف للسلة
← العودة

</div>
</div>
</section>
<div id="overlay" class="overlay" onclick="closePanels()"></div>
<div id="cartPanel" class="panel">
<div class="panel-head">
<h2>🛒 السلة</h2>
<button class="close" onclick="closePanels()">×</button>
</div>
<div id="cartBody" class="panel-body"></div>
<div class="panel-foot">
<div class="total">
<span>المجموع</span>
<span id="total">$0.00</span>
</div>
<button class="checkout" onclick="checkout()">إتمام الطلب</button>
</div>
</div>
<div id="checkoutPanel" class="panel">
<div class="panel-head">
<h2>📦 إتمام الطلب</h2>
<button class="close" onclick="closePanels()">×</button>
</div>
<div class="panel-body">
<div class="form">
<label>الاسم</label>
<input id="name" class="input" placeholder="اكتب اسمك">
</div>
<div class="form">
<label>رقم الهاتف</label>
<input id="phone" class="input" placeholder="03 123 456">
</div>
<div class="form">
<label>المنطقة</label>
<input id="area" class="input" placeholder="مثال: صيدا">
</div>
<div class="form">
<label>العنوان</label>
<textarea id="address" class="input area" placeholder="اكتب العنوان"></textarea>
</div>
<div class="form">
<label>ملاحظات</label>
<textarea id="notes" class="input area" placeholder="اختياري"></textarea>
</div>
<div id="summary" class="summary"></div>
</div>
<div class="panel-foot">
<button id="send" class="checkout" onclick="sendOrder()">تأكيد الطلب ✓</button>
</div>
</div>
<div class="bottom-nav">

⌂الرئيسية
▦الأقسام
♡المفضلة
🛒السلة

</div>
<footer>
<div class="footer-logo">تِكرَم</div>
<p>من بيتنا لبيتك 🤍</p>
</footer>
<script>
const KEY="9edc6eae-83a6-4858-a452-12860503dcfa",DELIVERY=2;
const cats=["الكل","مشروبات","ألبان وأجبان","مواد غذائية","مواد تنظيف","بلاستيك"];
const products=[
{
id:"coffee-no",
cat:"مشروبات",
name:"قهوة نجار دون هال",
en:"Najjar Coffee No Cardamom",
price:3.35,
weight:"180 غ / 450 غ",
img:"./najjar-coffee-no-cardamom-180g.JPG",
options:[
["180 غ",3.35,"./najjar-coffee-no-cardamom-180g.JPG"],
["450 غ",6.85,"./najjar-coffee-no-cardamom-450g.JPG"]
]
},
{
id:"coffee-card",
cat:"مشروبات",
name:"قهوة نجار مع هال",
en:"Najjar Coffee with Cardamom",
price:3.55,
weight:"180 غ / 450 غ",
img:"./najjar-coffee-with-cardamom-180g.JPG",
options:[
["180 غ",3.55,"./najjar-coffee-with-cardamom-180g.JPG"],
["450 غ",7.35,"./najjar-coffee-with-cardamom-450g.JPG"]
]
},
{
id:"ghazal",
cat:"ألبان وأجبان",
name:"جبنة الغزال",
en:"Al Ghazal Cheese",
price:2.70,
weight:"370 غ / 1.5 كغ",
icon:"🧀",
options:[
["370 غ",2.70,""],
["1.5 كغ",11.50,""]
]
},
{
id:"almarai",
cat:"ألبان وأجبان",
name:"جبنة المراعي",
en:"Almarai Cheese",
price:1.70,
weight:"300 غ",
icon:"🧀"
},
{
id:"greek",
cat:"ألبان وأجبان",
name:"يوغرت تعنايل غريك",
en:"Taanayel Greek Yogurt",
price:1.25,
weight:"سادة / فريز / توت / دراق",
icon:"🥛",
options:[
["سادة",1.25,"🥛"],
["فريز",1.25,"🍓"],
["توت",1.25,"🫐"],
["دراق",1.25,"🍑"]
]
},
{
id:"corn",
cat:"مواد غذائية",
name:"ذرة حلوة لا بيلا",
en:"La Bella Sweet Corn",
price:.85,
weight:"340 غ",
img:"./la-bella-sweet-corn-340g.JPG"
},
{
id:"red",
cat:"مواد غذائية",
name:"نجار الأحمر",
en:"Najjar Red",
price:3,
weight:"95 غ / 190 غ",
img:"./najjar-red-95g.JPG",
options:[
["95 غ",3,"./najjar-red-95g.JPG"],
["190 غ",4.90,"./najjar-red-190g.JPG"]
]
},
{
id:"mate",
cat:"مشروبات",
name:"كريمر كوفي ميت",
en:"Coffee Mate",
price:2.50,
weight:"450 غ",
img:"./coffee-mate-450g.JPG"
},
{
id:"picon",
cat:"ألبان وأجبان",
name:"بيكون جبنة",
en:"Picon Cheese",
price:2.50,
weight:"×16 / ×24",
img:"./Picon-cheese-*16.JPG",
options:[
["×16",2.50,"./Picon-cheese-*16.JPG"],
["×24",3,"./Picon-cheese-*24.JPG"]
]
},
{
id:"picon8",
cat:"ألبان وأجبان",
name:"بيكون سِمبلي ×8",
en:"Picon Cheese Simply ×8",
price:.90,
weight:"×8",
img:"./Picon-cheese-simply-*8.JPG"
},
{
id:"trobika",
cat:"مشروبات",
name:"تروبيكا كابتشينو",
en:"Trobika Cappuccino 20+2",
price:4.55,
weight:"20 + 2",
img:"./Trobika-Cappuccino-20+2.JPG"
},
{
id:"nescafe",
cat:"مشروبات",
name:"نسكافيه كلاسيك 2 في 1",
en:"Nescafé Classic 2 in 1",
price:5.25,
weight:"2 in 1",
img:"./Nescafe-classic—2in1.JPG"
},
{
id:"cream",
cat:"ألبان وأجبان",
name:"كريمة طبخ نيو بارك",
en:"New Park Cooking Cream",
price:1,
weight:"160 مل / 1 لتر",
img:"./New-park-cooking-cream -160ml.JPG",
options:[
["160 مل",1,"./New-park-cooking-cream -160ml.JPG"],
["1 لتر",3,"./New-park-cooking-cream -1liter.JPG"]
]
}
];
let cart=JSON.parse(localStorage.getItem("tekramCart")||"[]");
let fav=JSON.parse(localStorage.getItem("tekramFavorites")||"[]");
let category="الكل",onlyFav=false,selected=null;
function save(){
localStorage.setItem("tekramCart",JSON.stringify(cart));
localStorage.setItem("tekramFavorites",JSON.stringify(fav));
}
function nav(n){
document.querySelectorAll(".bottom-nav button").forEach((x,i)=>x.classList.toggle("active",i===n));
}
function categoriesHTML(){
catsEl.innerHTML=cats.map(x=>`<button class="${x===category&&!onlyFav?"active":""}" onclick="choose('${x}')">${x}</button>`).join("");
}
function card(p){
let favorite=fav.includes(p.id);
return `
<div class="card" onclick="detail('${p.id}')">
<button class="fav ${favorite?"on":""}" onclick="toggleFav(event,'${p.id}')">${favorite?"♥":"♡"}</button>
<div class="pic">${p.img?`<img src="${p.img}">`:p.icon||"🛒"}</div>
<div class="info">
<span class="badge">${p.cat}</span>
<div class="name">${p.name}</div>
<div class="en">${p.en}</div>
<div class="weight">${p.weight}</div>
<div class="bottom">
<div class="price">${p.options?"من ":""}$${p.price.toFixed(2)}</div>
<button class="add" onclick="quick(event,'${p.id}')">+</button>
</div>
</div>
</div>`;
}
function render(){
let q=search.value.trim().toLowerCase();
let list=products.filter(p=>
(!onlyFav||fav.includes(p.id))&&
(category==="الكل"||p.cat===category)&&
(!q||(p.name+" "+p.en).toLowerCase().includes(q))
);
title.textContent=onlyFav?"المفضلة":q?"نتائج البحث":category==="الكل"?"منتجاتنا":category;
sub.textContent=onlyFav?"المنتجات التي حفظتها ❤️":"اختيارات من تِكرَم";
grid.innerHTML=list.length?list.map(card).join():
`<div class="empty">ما لقينا منتجات مطابقة ❤️</div>`;
categoriesHTML();
updateCart();
}
function choose(x){
category=x;onlyFav=false;render();
scrollProducts();
nav(1);
}
function categoriesPage(){
home();
nav(1);
setTimeout(scrollProducts,50);
}
function favoritesPage(){
category="الكل";onlyFav=true;
productPage.style.display="none";
homePage.style.display="block";
render();nav(2);
scrollProducts();
}
function toggleFav(e,id){
e.stopPropagation();
fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];
save();render();
}
function quick(e,id){
e.stopPropagation();
let p=products.find(x=>x.id===id);
let o=p.options?p.options[0]:[p.weight,p.price,p.img||p.icon||""];
add({name:p.name,option:o[0],price:o[1]});
openCart();
}
function detail(id,opt=0){
let p=products.find(x=>x.id===id);
selected={name:p.name,option:p.options?p.options[opt][0]:p.weight,price:p.options?p.options[opt][1]:p.price};
dcat.textContent=p.cat;
dname.textContent=p.name;
den.textContent=p.en;
dweight.textContent=selected.option;
dprice.textContent="$"+selected.price.toFixed(2);
ddesc.textContent=p.name+"، "+selected.option;
let image=p.options?p.options[opt][2]:p.img;
dimg.innerHTML=image?`<img src="${image}">`:
p.options?`<span style="font-size:100px">${p.options[opt][2]}</span>`:
`<span>${p.icon||"🛒"}</span>`;
options.innerHTML=p.options?p.options.map((o,i)=>
`<button class="option ${i===opt?"sel":""}" onclick="detail('${p.id}',${i})">${o[0]}</button>`
).join(""):"";
homePage.style.display="none";
productPage.style.display="block";
window.scrollTo(0,0);
}
function add(x){
let old=cart.find(i=>i.name===x.name&&i.option===x.option);
old?old.qty++:cart.push({...x,qty:1});
save();updateCart();
}
function addSelected(){
add(selected);openCart();
}
function updateCart(){
count.textContent=cart.reduce((a,x)=>a+x.qty,0);
if(!cart.length){
cartBody.innerHTML=`<div class="empty">السلة فارغة 🛒</div>`;
total.textContent="$0.00";
return;
}
cartBody.innerHTML=cart.map((x,i)=>`
<div class="cart-item">
<div class="cart-row"><div><b>${x.name}</b><small>${x.option}</small></div><b class="cart-price">$${(x.price*x.qty).toFixed(2)}</b></div>
<div class="controls">
<button class="qty" onclick="qty(${i},-1)">−</button>
<b>${x.qty}</b>
<button class="qty" onclick="qty(${i},1)">+</button>
<button class="remove" onclick="removeItem(${i})">حذف</button>
</div>
</div>`).join("");
let t=cart.reduce((a,x)=>a+x.price*x.qty,0);
total.textContent="$"+t.toFixed(2);
}
function qty(i,n){
cart[i].qty+=n;
if(cart[i].qty<1)cart.splice(i,1);
save();updateCart();
}
function removeItem(i){
cart.splice(i,1);save();updateCart();
}
function openCart(){
closePanels();
cartPanel.style.right="0";
overlay.style.display="block";
nav(3);
}
function checkout(){
if(!cart.length)return alert("السلة فارغة");
closePanels();
checkoutPanel.style.right="0";
overlay.style.display="block";
let s=cart.reduce((a,x)=>a+x.price*x.qty,0);
summary.innerHTML=cart.map(x=>
`<div class="summary-row"><span>${x.name}<br><small>${x.option} × ${x.qty}</small></span><b>$${(x.price*x.qty).toFixed(2)}</b></div>`
).join("")+
`<div class="summary-row"><b>المجموع الفرعي</b><b>$${s.toFixed(2)}</b></div>
<div class="summary-row"><b>التوصيل</b><b>$${DELIVERY.toFixed(2)}</b></div>
<div class="summary-row final"><b>المجموع النهائي</b><b>$${(s+DELIVERY).toFixed(2)}</b></div>`;
}
function closePanels(){
cartPanel.style.right="-430px";
checkoutPanel.style.right="-430px";
overlay.style.display="none";
}
async function sendOrder(){
let n=name.value.trim(),ph=phone.value.trim(),ar=area.value.trim(),ad=address.value.trim();
if(!n||!ph||!ar||!ad)return alert("يرجى تعبئة الاسم والهاتف والمنطقة والعنوان");
let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
let order=cart.map(x=>`• ${x.name} | ${x.option} | ×${x.qty} | $${(x.price*x.qty).toFixed(2)}`).join("\n");
send.disabled=true;
send.textContent="جاري الإرسال...";
try{
let r=await fetch("https://api.web3forms.com/submit",{
method:"POST",
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify({
access_key:KEY,
subject:"🛒 طلب جديد من تِكرَم",
name:n,phone:ph,area:ar,address:ad,
notes:notes.value,
order,
subtotal:"$"+sub.toFixed(2),
delivery:"$"+DELIVERY.toFixed(2),
total:"$"+(sub+DELIVERY).toFixed(2)
})
});
let data=await r.json();
if(data.success){
alert("تم إرسال طلبك بنجاح ❤️");
cart=[];save();updateCart();closePanels();
name.value=phone.value=area.value=address.value=notes.value="";
}else alert("تعذر إرسال الطلب.");
}catch(e){
alert("تعذر إرسال الطلب حالياً.");
}
send.disabled=false;
send.textContent="تأكيد الطلب ✓";
}
function home(){
productPage.style.display="none";
homePage.style.display="block";
category="الكل";onlyFav=false;
render();nav(0);
}
function scrollProducts(){
products.scrollIntoView({behavior:"smooth"});
}
const catsEl=document.getElementById("cats");
categoriesHTML();
render();
</script>
</body>
